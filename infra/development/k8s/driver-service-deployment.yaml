apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-service
  namespace: trip-platform
  labels:
    app: driver-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driver-service
  template:
    metadata:
      labels:
        app: driver-service
    spec:
      containers:
      - name: driver-service
        image: trip-platform/driver-service
        ports:
        - containerPort: 8082
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: driver-service
  namespace: trip-platform
spec:
  selector:
    app: driver-service
  ports:
  - port: 8082
    targetPort: 8082
  type: ClusterIP
