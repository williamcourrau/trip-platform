server:
  port: 8081

spring:
  application:
    name: trip-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/trip_db}
      auto-index-creation: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

grpc:
  server:
    port: 9091

logging:
  level:
    com.trip: DEBUG
